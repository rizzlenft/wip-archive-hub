name: Clawpatch Review

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "clawpatch provider (codex, cursor, mock)"
        required: false
        default: "mock"
      review_limit:
        description: "Max features to review"
        required: false
        default: "20"

jobs:
  clawpatch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install clawpatch
        run: npm install -g clawpatch@latest

      - name: Review (report only — no auto-fix)
        run: |
          clawpatch init || true
          clawpatch map
          clawpatch status
          PROVIDER="${{ github.event.inputs.provider }}"
          LIMIT="${{ github.event.inputs.review_limit }}"
          clawpatch review --provider "$PROVIDER" --jobs 2 --limit "$LIMIT" || true
          clawpatch report -o clawpatch-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: clawpatch-report
          path: clawpatch-report.md
          if-no-files-found: warn
